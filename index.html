<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Tour</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    // ===== 1. Apne scenes yahan likhein =====
    // title = screen par dikhne wala naam (apne hisab se badal lein)
    const scenes = {
      cam1: {
        title: 'Living Room',
        image: 'images/1bedcam1.jpg',
        hotspots: [
          { to: 'cam2', pos: '-4.5 -0.5 -0.2', label: 'Next' },
          
        ]
      },
      cam2: {
        title: 'Kitchen',
        image: 'images/1bedcam2.jpg',
        hotspots: [
          { to: 'cam1', pos: '-3.8 -0.2 -2.7Ab aap: Kitchen mein hain', label: 'Back' },
          
        ]
      },
      cam3: {
        title: 'Bedroom',
        image: 'images/1bedcam3.jpg',
        hotspots: [
          { to: 'cam1', pos: '-4 1.6 -3', label: 'Living' },
          { to: 'cam2', pos: '4 1.6 3', label: 'Kitchen' }
        ]
      }
    };

    // Tour shuru kis scene se ho
    const START_SCENE = 'cam1';

    // ===== 2. Coordinates nikalne wala picker =====
    AFRAME.registerComponent('picker', {
      init: function () {
        this.el.addEventListener('click', function (e) {
          const p = e.detail.intersection.point.clone();
          p.y -= 1.6;
          p.setLength(5);
          p.y += 1.6;
          const s = p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' ' + p.z.toFixed(1);
          console.log(s);
          document.querySelector('#info').textContent = s;
        });
      }
    });

    // ===== 3. Tour ka logic =====
    AFRAME.registerComponent('tour', {
      init: function () {
        this.load(START_SCENE);
      },
      load: function (name) {
        const sky = document.querySelector('#sky');
        const box = document.querySelector('#hotspots');
        sky.setAttribute('src', scenes[name].image);

        // Current scene ka naam screen par dikhayen
        document.querySelector('#scene-name').textContent =
          'Ab aap: ' + scenes[name].title + ' mein hain';

        while (box.firstChild) box.removeChild(box.firstChild);

        scenes[name].hotspots.forEach(function (h) {
          const dot = document.createElement('a-sphere');
          dot.setAttribute('position', h.pos);
          dot.setAttribute('radius', 0.15);
          dot.setAttribute('color', '#ffffff');
          dot.setAttribute('class', 'clickable');
          dot.addEventListener('click', function () {
            document.querySelector('#hotspots').components.tour.load(h.to);
          });

          const txt = document.createElement('a-entity');
          txt.setAttribute('position', '0 0.6 0');
          txt.setAttribute('text', {
            value: h.label,
            align: 'center',
            width: 6,
            color: '#ffffff'
          });
          dot.appendChild(txt);

          box.appendChild(dot);
        });
      }
    });
  </script>
</head>
<body>
  <!-- Coordinates yahan dikhenge (left) -->
  <div id="info" style="position:fixed;top:10px;left:10px;z-index:99;background:#000;color:#fff;padding:8px;font-size:18px;">click karein</div>

  <!-- Current scene ka naam yahan dikhega (right) -->
  <div id="scene-name" style="position:fixed;top:10px;right:10px;z-index:99;background:#000;color:#fff;padding:8px;font-size:18px;"></div>

  <a-scene>
    <a-sky id="sky" class="pickable" picker src="images/1bedcam1.jpg"></a-sky>
    <a-entity id="hotspots" tour></a-entity>

    <a-entity camera look-controls position="0 1.6 0"></a-entity>

    <!-- PC par mouse click -->
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable, .pickable"></a-entity>

    <!-- Quest controller se click -->
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable, .pickable; far: 50"></a-entity>
  </a-scene>
</body>
</html>
