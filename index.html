<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Tour</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    #scene-name { position: fixed; top: 10px; right: 10px; z-index: 9999; background: #000; color: #fff; padding: 8px; font-size: 16px; max-width: 80vw; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="scene-name">Page khul gaya, A-Frame load ho raha hai...</div>

  <script>
    // ===== 1. Settings =====
    const IMAGE_CANDIDATES = [
      '123.jpg',
      '123.jpeg',
      '123.JPG',
      '123.png',
      'images/123.jpg',
      'images/123.jpeg',
      'images/123.JPG'
    ];

    const TITLE = 'Studio';

    // Is image mein ek poora 360 lagbhag 928 px mein hota hai
    const PANO_WIDTH = 928;
    const START_X = 0;

    // A-Frame ke alag alag links (pehla na chale to agla try hoga)
    const AFRAME_URLS = [
      'https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe.min.js',
      'https://unpkg.com/aframe@1.6.0/dist/aframe.min.js',
      'https://aframe.io/releases/1.6.0/aframe.min.js'
    ];

    const label = document.getElementById('scene-name');

    // ===== 2. A-Frame load karna =====
    function loadAframe(i) {
      if (i >= AFRAME_URLS.length) {
        label.innerHTML = 'A-Frame kisi link se load nahi hua.<br>Internet check karein ya VPN/ad-blocker band karke dekhein.';
        return;
      }
      const s = document.createElement('script');
      s.src = AFRAME_URLS[i];
      s.onload = startApp;
      s.onerror = () => loadAframe(i + 1);
      document.head.appendChild(s);
    }

    // ===== 3. Panorama component =====
    function startApp() {
      label.textContent = 'A-Frame load ho gaya, image dhoondh raha hai...';

      AFRAME.registerComponent('mono-pano', {
        init: function () {
          const THREE = AFRAME.THREE;
          const loader = new THREE.TextureLoader();
          const tried = [];

          const buildSphere = (texture, path) => {
            if ('colorSpace' in texture) texture.colorSpace = THREE.SRGBColorSpace;
            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const imgW = texture.image.width;
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            const uv = geometry.attributes.uv;
            const uScale = PANO_WIDTH / imgW;
            const uStart = START_X / imgW;
            for (let i = 0; i < uv.count; i++) {
              uv.setX(i, uv.getX(i) * uScale + uStart);
            }

            const material = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.y = -Math.PI / 2;
            this.el.object3D.add(mesh);

            label.textContent = 'Ab aap: ' + TITLE + ' mein hain (' + path + ')';
          };

          const tryNext = (i) => {
            if (i >= IMAGE_CANDIDATES.length) {
              label.innerHTML = 'Image nahi mili. Try kiye gaye paths:<br>' + tried.join('<br>');
              return;
            }
            const path = IMAGE_CANDIDATES[i];
            tried.push(path);
            loader.load(path, (t) => buildSphere(t, path), undefined, () => tryNext(i + 1));
          };

          tryNext(0);
        }
      });

      const scene = document.createElement('a-scene');
      scene.setAttribute('vr-mode-ui', 'enabled: true');
      scene.innerHTML =
        '<a-entity mono-pano></a-entity>' +
        '<a-entity camera="userHeight: 1.6" look-controls></a-entity>';
      document.body.appendChild(scene);
    }

    // ===== 4. Shuru =====
    if (location.protocol === 'file:') {
      label.textContent = 'File seedhi double-click se nahi khulegi. GitHub Pages ya Live Server use karein.';
    } else {
      loadAframe(0);
    }
  </script>
</body>
</html>
